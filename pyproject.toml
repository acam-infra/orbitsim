[project]
name = "orbitsim"
version = "0.1.0"
description = "Minimal orbit & constellation feature analysis: declarative YAML, closed knobs."
authors = [
    { name = "coco", email = "chocolatedesue@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
orbitsim = "orbitsim.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
research = [
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
# tests import the root-level export scripts (export_viz, export_cosim)
pythonpath = ["."]
