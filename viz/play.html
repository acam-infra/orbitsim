<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orbitsim × satsim · 协同仿真回放</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      html,
      body,
      #cesiumContainer {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #panel {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        width: 380px;
        max-height: calc(100% - 140px);
        overflow-y: auto;
        padding: 12px 14px;
        border-radius: 8px;
        background: rgb(20 22 28 / 90%);
        color: #e6e8ec;
      }
      select {
        width: 100%;
        margin-bottom: 6px;
      }
      #title {
        font-weight: 600;
        margin: 2px 0 4px;
      }
      #desc {
        color: #9aa1ad;
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      .row select {
        margin: 0;
      }
      .speed button {
        padding: 1px 8px;
        background: #2c313b;
        color: #e6e8ec;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .speed button.on {
        background: #2563eb;
      }
      #live {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin: 8px 0;
      }
      #live div {
        padding: 4px 6px;
        background: #11141a;
        border-radius: 4px;
      }
      #live b {
        display: block;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      #live span {
        color: #9aa1ad;
        font-size: 11px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
        margin: 6px 0;
      }
      th,
      td {
        padding: 2px 4px;
        border-bottom: 1px solid #2c313b;
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tr.cur td {
        background: #1e3a8a55;
      }
      canvas {
        width: 100%;
        height: 150px;
        background: #11141a;
        border-radius: 4px;
      }
      .legend span {
        display: inline-block;
        margin: 0 10px 2px 0;
      }
      .swatch {
        display: inline-block;
        width: 18px;
        height: 3px;
        margin-right: 4px;
        vertical-align: middle;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }
      #ticker {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        min-height: 120px;
      }
      #ticker li {
        margin: 1px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .k-mig {
        color: #fb923c;
      }
      .k-abort {
        color: #f87171;
      }
      .k-lost {
        color: #f87171;
      }
      .k-cut {
        color: #fca5a5;
      }
      .k-done {
        color: #93c5fd;
      }
      h4 {
        margin: 10px 0 2px;
        font-size: 12px;
        color: #cbd5e1;
      }
      .note {
        color: #9aa1ad;
        font-size: 12px;
      }
      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="panel">
      <select id="playback"></select>
      <div id="title"></div>
      <div id="desc"></div>
      <div class="row">
        <label style="flex: 1">策略 <select id="policy"></select></label>
      </div>
      <div class="row speed" id="speed">倍速</div>
      <div id="live"></div>
      <div class="legend">
        <span><i class="swatch" style="background: #22d3ee"></i>面内</span>
        <span><i class="swatch" style="background: #facc15"></i>跨面 (时变)</span>
        <span><i class="swatch" style="background: #f43f5e"></i>遥感→算力 (时变)</span>
        <span><i class="swatch" style="background: #fb923c; height: 5px"></i>链路在传数据 (越粗越满)</span>
      </div>
      <div class="legend">
        <span><i class="dot" style="background: #fff; outline: 2px solid #f43f5e"></i>遥感星</span>
        <span><i class="dot" style="background: #34d399"></i>算力星 (色 = 显存占用, 大小 = 在跑请求)</span>
        <span><i class="dot" style="background: #334155; outline: 2px solid #64748b"></i>地影中 (限功 0.35×)</span>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background: #4ade80"></i>上传</span>
        <span><i class="swatch" style="background: #fb923c; height: 4px"></i>KV 迁移</span>
        <span><i class="swatch" style="background: #93c5fd"></i>结果回传</span>
        <span><i class="swatch" style="background: #ef4444"></i>断链/中止</span>
      </div>
      <h4>各策略 (多种子均值)</h4>
      <div id="table"></div>
      <h4>累计达标请求, 相对 greedy 的差值 (同一种子, 竖线 = 当前时刻)</h4>
      <canvas id="chart"></canvas>
      <h4>事件 (迁移 / 中止 / 断链)</h4>
      <ul id="ticker"></ul>
      <p class="note">
        轨道由 orbitsim 闭式解传播, 网络事件由 satsim 按同一份接触轨迹仿真; 两者共用时钟.
        <a href="./">← 星座几何查看器</a>
      </p>
    </div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
