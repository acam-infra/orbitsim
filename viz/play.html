<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orbitsim × satsim · 协同仿真回放</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          12.5px/1.4 system-ui,
          sans-serif;
      }
      html,
      body,
      #cesiumContainer {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #panel {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        width: 340px;
        max-height: calc(100% - 135px);
        overflow-y: auto;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgb(18 20 26 / 92%);
        color: #e6e8ec;
        box-sizing: border-box;
      }
      select {
        width: 100%;
        padding: 3px 6px;
        background: #1a1e26;
        color: #e6e8ec;
        border: 1px solid #2e3440;
        border-radius: 4px;
      }
      #takeaway {
        margin: 0 0 8px;
        padding: 6px 8px;
        background: #131b2e;
        border-left: 3px solid #38bdf8;
        border-radius: 4px;
        color: #e2e8f0;
        font-size: 12px;
        line-height: 1.4;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 5px 0;
      }
      .row label {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: #cbd5e1;
      }
      .row select {
        flex: 1;
        margin: 0;
      }
      .btn,
      .speed button {
        padding: 2px 7px;
        background: #2c313b;
        color: #e6e8ec;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .btn:hover:not(:disabled),
      .speed button:hover {
        background: #3b4252;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .speed button.on {
        background: #2563eb;
      }
      #hint {
        color: #8b94a3;
        font-size: 11px;
        margin: 3px 0 6px;
      }
      #live {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin: 6px 0;
      }
      #live div {
        padding: 4px 6px;
        background: #11141a;
        border-radius: 4px;
      }
      #live b {
        display: block;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      #live span {
        color: #9aa1ad;
        font-size: 10.5px;
      }
      details.legend-box {
        margin: 4px 0 6px;
        padding: 4px 6px;
        background: #11141a;
        border-radius: 4px;
        font-size: 11.5px;
      }
      details.legend-box summary {
        cursor: pointer;
        color: #9aa1ad;
        user-select: none;
      }
      details.legend-box[open] summary {
        margin-bottom: 4px;
      }
      .legend-grid span {
        display: inline-block;
        margin: 1px 8px 1px 0;
      }
      .swatch {
        display: inline-block;
        width: 14px;
        height: 3px;
        margin-right: 4px;
        vertical-align: middle;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
        margin: 4px 0;
        font-size: 12px;
      }
      th,
      td {
        padding: 3px 4px;
        border-bottom: 1px solid #2c313b;
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tr[data-pol] {
        cursor: pointer;
      }
      tr[data-pol]:hover td {
        background: #1e293b99;
      }
      tr.cur td {
        background: #1e3a8a66;
        font-weight: 600;
      }
      canvas {
        width: 100%;
        height: 120px;
        background: #11141a;
        border-radius: 4px;
        display: block;
      }
      #ticker {
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      #ticker li {
        margin: 1px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .k-mig {
        color: #fb923c;
      }
      .k-abort {
        color: #f87171;
      }
      .k-lost {
        color: #f87171;
      }
      .k-cut {
        color: #fca5a5;
      }
      .k-done {
        color: #93c5fd;
      }
      h4 {
        margin: 8px 0 2px;
        font-size: 11.5px;
        color: #cbd5e1;
        font-weight: 600;
      }
      .note {
        color: #9aa1ad;
        font-size: 11px;
        margin: 6px 0 0;
      }
      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="panel">
      <div id="takeaway"></div>
      <div class="row">
        <label style="flex: 1">场景 <select id="playback"></select></label>
      </div>
      <div class="row">
        <label style="flex: 1">策略 <select id="policy"></select></label>
      </div>
      <div class="row">
        <div class="speed" id="speed">倍速</div>
        <button class="btn" id="nextMig" style="margin-left: auto">跳到下一次迁移</button>
      </div>
      <div class="row" style="justify-content: space-between">
        <label><input type="checkbox" id="showIo" /> 显示上传/回传</label>
        <span id="hint">Space 播放 · 1-4 策略 · ←/→ ±60s</span>
      </div>
      <div id="live"></div>
      <details class="legend-box">
        <summary>图例（卫星 · 链路 · 事件箭头）</summary>
        <div class="legend-grid">
          <span><i class="dot" style="background: #fff; outline: 2px solid #f43f5e"></i>遥感星(RS)</span>
          <span><i class="dot" style="background: #34d399"></i>算力星(色=显存, 大小=在跑)</span>
          <span><i class="dot" style="background: #334155; outline: 2px solid #64748b"></i>地影(0.35×)</span>
          <br />
          <span><i class="swatch" style="background: #22d3ee"></i>面内</span>
          <span><i class="swatch" style="background: #facc15"></i>跨面</span>
          <span><i class="swatch" style="background: #f43f5e"></i>RS→算力</span>
          <span><i class="swatch" style="background: #fb923c; height: 5px"></i>在传数据</span>
          <br />
          <span><i class="swatch" style="background: #fb923c; height: 4px"></i>KV 迁移</span>
          <span><i class="swatch" style="background: #ef4444"></i>断链/中止</span>
          <span><i class="swatch" style="background: #4ade80"></i>上传</span>
          <span><i class="swatch" style="background: #93c5fd"></i>回传</span>
        </div>
      </details>
      <h4>策略对比（多种子均值，点击行切换）</h4>
      <div id="table"></div>
      <h4>比 greedy 多达标的请求数（竖线 = 当前时刻）</h4>
      <canvas id="chart"></canvas>
      <h4>最近关键事件（迁移 / 断链 / 中止）</h4>
      <ul id="ticker"></ul>
      <p class="note">
        orbitsim 轨道 + satsim 网络共用时钟 · <a href="./">← 星座几何查看器</a>
      </p>
    </div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
